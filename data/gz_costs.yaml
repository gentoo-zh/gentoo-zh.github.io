# 社区基础设施的开销。资金计算表（/funding/）从这里渲染，改数字只改这一处。
#
# amount    当前每期价格，配合 currency 与 period
# period    monthly 每月 / yearly 每年
# start     开始计费的日期，用来算累计支出
# paid_amounts 已付各期金额（原币种，含预缴）；填写后以笔数和金额合计替代按日期推算。
#              这是当前付款记录，不用于还原历史账目；没有记录的项目仍按 start 累计。
# usd_month 折算成美元的月均值，用于合计
# end       停用日期；写了就只累计到这一天，也不计入月均
# sponsored 由赞助方免费提供，价格一栏写赞助方而不是免费额度
#
# 汇率按 2026 年 7 月：EUR 1 = USD 1.1524
# 汇率取自 distfiles 那笔年付的实际扣款：100 EUR = 115.24 USD = 777 CNY = 3713.80 TWD = 900 HKD
