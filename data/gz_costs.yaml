# 社区基础设施的开销。资金计算表（/funding/）从这里渲染，改数字只改这一处。
#
# amount    金额，配合 currency 与 period
# period    monthly 每月 / yearly 每年 / once 一次性
# start     开始计费的日期，用来算累计支出
# usd       折算成美元的月均值，用于合计；一次性支出不计入月均
# end       停用日期；写了就只累计到这一天，也不计入月均
# sponsored 由赞助方免费提供，价格一栏写赞助方而不是免费额度
