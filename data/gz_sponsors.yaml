# 首页“致谢”一栏。scale 为显示高度的比例（默认 1），用来让各标志看起来一样大。
# 顺序、名称与链接和致谢页（content/*/thanks/）保持一致，改一处要同步另一处。
# individual: true 为个人：只列在致谢页，不进首页这一栏。
- href: "https://osuosl.org/"
  # OSL 未公开矢量标志：由 osuosl/website 仓库的原 PNG（327×169）放大 10 倍后用 potrace 描成矢量，
  # 保留原画布与边距；原 PNG 在高分屏上发糊。
  img: "/img/thanks/osuosl-light.svg"
  img_dark: "/img/thanks/osuosl-dark.svg"
  wide: true
  name: "俄勒冈州立大学开源实验室"
  name_tw: "奧勒岡州立大學開放原始碼實驗室"
  name_en: "Oregon State University Open Source Lab"
- href: "https://mirrors.cernet.edu.cn/"
  img: "/img/thanks/cernet.svg"
  scale: 0.85  # 图案铺满画布，同高时显得比其他标志大
  name: "教育网联合镜像站"
  name_tw: "教育網聯合鏡像站"
  name_en: "CERNET"
- href: "https://mirror.nju.edu.cn/"
